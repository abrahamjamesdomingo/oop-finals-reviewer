<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1E1E1E">
<title>OOP Finals Reviewer — CS 212 VB.NET</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* ============ TOKENS ============ */
:root{
  color-scheme:dark;
  --bg:#1E1E1E; --panel:#252526; --card:#2D2D30; --card2:#333336;
  --border:#3E3E42; --border-soft:#333338;
  --text:#D4D4D4; --bright:#FFFFFF; --muted:#A0A0A0;
  --blue:#569CD6; --teal:#4EC9B0; --amber:#CE9178; --green:#89D185; --green-dim:#6A9955;
  --red:#F48771; --yellow:#DCDCAA; --purple:#C586C0; --num:#B5CEA8;
  --mono:'Cascadia Code','Consolas','Courier New',ui-monospace,SFMono-Regular,monospace;
  --sans:system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --radius:6px; --topbar-h:50px; --status-h:28px;
}
/* ============ RESET / BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;
  height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
ul{padding-left:1.25rem}
li{margin:.3rem 0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
/* ============ TOP BAR ============ */
.topbar{height:var(--topbar-h);background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.7rem;padding:0 .8rem;flex-shrink:0}
.menu-btn{width:44px;height:44px;margin-left:-.6rem;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);flex-shrink:0}
.menu-btn:hover{background:var(--card2)}
.menu-btn svg{width:20px;height:20px;fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round}
.brand{font-family:var(--mono);font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--bright);font-weight:600}
.brand .acc{color:var(--teal)}
/* ============ LAYOUT ============ */
.shell{flex:1;display:flex;min-height:0;position:relative}
.main{flex:1;overflow-y:auto;min-width:0;scroll-behavior:smooth}
.view{max-width:860px;margin:0 auto;padding:1.4rem 1.1rem 3rem}
/* ============ SIDEBAR (Solution Explorer) ============ */
.scrim{display:none;position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:40}
.sidebar{position:absolute;z-index:50;top:0;bottom:0;left:0;width:290px;background:var(--panel);
  border-right:1px solid var(--border);transform:translateX(-105%);transition:transform .22s ease;
  display:flex;flex-direction:column}
.sidebar.open{transform:translateX(0)}
.scrim.show{display:block}
.side-head{display:flex;align-items:center;justify-content:space-between;
  padding:.9rem 1rem .5rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted)}
.side-close{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius)}
.side-close:hover{background:var(--card2)}
.side-close svg{width:18px;height:18px;stroke:var(--text);stroke-width:2;fill:none;stroke-linecap:round}
.nav{overflow-y:auto;padding:.25rem .5rem 1.5rem}
.nav-group{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:1rem .5rem .35rem}
.nav a{display:block;padding:.5rem .6rem;border-radius:var(--radius);
  color:var(--text);font-size:.92rem;line-height:1.35;min-height:44px}
.nav a:hover{background:var(--card2);text-decoration:none}
.nav a.active{background:var(--card2);color:var(--bright);box-shadow:inset 2px 0 0 var(--blue)}
.nav a .fi{font-family:var(--mono);font-size:.72rem;color:var(--yellow);display:block;margin-bottom:.1rem}
.nav a.active .fi{color:var(--blue)}
.nav a .sub{display:block;font-size:.72rem;color:var(--muted);margin-top:.15rem}
@media (min-width:900px){
  .sidebar{position:static;transform:none;width:290px;flex-shrink:0}
  .menu-btn,.side-close,.scrim{display:none!important}
}
/* ============ TYPO / HEADINGS ============ */
h1{font-family:var(--mono);font-size:1.45rem;line-height:1.3;color:var(--bright);font-weight:600;margin:.2rem 0 .4rem}
h2{font-family:var(--mono);font-size:1.05rem;color:var(--bright);font-weight:600;margin:2rem 0 .7rem;
  padding-top:1.2rem;border-top:1px solid var(--border-soft)}
h2:first-of-type{border-top:none}
h3{font-family:var(--mono);font-size:.95rem;color:var(--yellow);font-weight:600;margin:1.4rem 0 .5rem}
p{margin:.6rem 0}
.kicker{font-family:var(--mono);font-size:.75rem;color:var(--muted);letter-spacing:.05em;margin-bottom:.2rem}
.lead{color:var(--text);font-size:1rem}
/* ============ BADGES / CHIPS ============ */
.badge{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;
  padding:.15rem .55rem;border-radius:999px;border:1px solid var(--border);color:var(--muted);vertical-align:middle}
.badge.blue{color:var(--blue);border-color:var(--blue)}
.badge.teal{color:var(--teal);border-color:var(--teal)}
.badge.amber{color:var(--amber);border-color:var(--amber)}
.badge.red{color:var(--red);border-color:var(--red)}
.badge.green{color:var(--green);border-color:var(--green-dim)}
.badge.dim{opacity:.55}
/* ============ CARDS & GRIDS ============ */
.card{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);padding:1rem 1.1rem;margin:.8rem 0}
.card h3{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr;gap:.7rem;margin:.9rem 0}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.tiles{display:grid;grid-template-columns:1fr;gap:.7rem;margin:1rem 0}
@media (min-width:640px){.tiles{grid-template-columns:1fr 1fr}}
.tile{display:block;background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:.9rem 1rem;color:var(--text);min-height:44px}
.tile:hover{border-color:var(--blue);text-decoration:none;background:var(--card2)}
.tile .t-file{font-family:var(--mono);font-size:.78rem;color:var(--yellow);display:block}
.tile .t-title{color:var(--bright);font-weight:600;font-size:.95rem}
.tile .t-desc{font-size:.8rem;color:var(--muted);display:block;margin-top:.15rem}
/* ============ CALLOUTS ============ */
.callout{border:1px solid var(--border);border-left:3px solid var(--blue);background:var(--card);
  border-radius:var(--radius);padding:.8rem 1rem;margin:.9rem 0}
.callout .co-title{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  display:block;margin-bottom:.25rem;color:var(--blue)}
.callout.teal{border-left-color:var(--teal)}.callout.teal .co-title{color:var(--teal)}
.callout.amber{border-left-color:var(--amber)}.callout.amber .co-title{color:var(--amber)}
.callout.green{border-left-color:var(--green-dim)}.callout.green .co-title{color:var(--green)}
.callout.red{border-left-color:var(--red)}.callout.red .co-title{color:var(--red)}
.callout p{margin:.35rem 0}
/* ============ CODE BLOCKS ============ */
.code{background:#1a1a1a;border:1px solid var(--border-soft);border-radius:var(--radius);margin:1rem 0;overflow:hidden}
.code-tab{display:flex;align-items:center;gap:.5rem;background:var(--panel);border-bottom:1px solid var(--border);
  padding:.4rem .8rem;font-family:var(--mono);font-size:.78rem;color:var(--text)}
.code-tab .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex-shrink:0}
.code-tab .lang{margin-left:auto;font-size:.62rem;color:var(--bg);background:var(--blue);padding:.05rem .4rem;border-radius:3px;font-weight:700}
.code-body{display:block;padding:.8rem .6rem;font-family:var(--mono);font-size:.8rem;line-height:1.55;
  overflow-x:auto;counter-reset:line;color:#d4d4d4}
.cl{display:block;counter-increment:line;padding-left:3.1rem;position:relative;white-space:pre}
.cl::before{content:counter(line);position:absolute;left:0;width:2.3rem;text-align:right;color:#5a5a5a;user-select:none}
.c-key{color:var(--blue)} .c-str{color:var(--amber)} .c-com{color:var(--green-dim);font-style:italic}
.c-typ{color:var(--teal)} .c-num{color:var(--num)}
/* ============ TABLES ============ */
.twrap{overflow-x:auto;margin:1rem 0;border:1px solid var(--border-soft);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.85rem}
th,td{padding:.55rem .8rem;text-align:left;border-bottom:1px solid var(--border-soft)}
th{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel)}
tr:last-child td{border-bottom:none}
td.yes{color:var(--green);font-weight:600} td.no{color:var(--red)}
/* ============ CONCEPT MAP ============ */
.cmap{display:flex;flex-direction:column;gap:0;margin:1.2rem 0;align-items:stretch}
.cmap .node{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:.7rem 1rem;font-family:var(--mono);font-size:.85rem;color:var(--bright)}
.cmap .node small{display:block;font-family:var(--sans);color:var(--muted);font-size:.75rem}
.cmap .link{align-self:center;font-family:var(--mono);font-size:.7rem;color:var(--teal);padding:.3rem 0 .3rem 0;text-align:center}
.cmap .link::before{content:"↓";display:block;font-size:.85rem;color:var(--muted)}
@media (min-width:760px){
  .cmap{flex-direction:row;align-items:center;justify-content:flex-start;gap:.4rem}
  .cmap .node{flex:1}
  .cmap .link::before{content:"→"}
  .cmap .link{padding:0 .2rem}
}
/* ============ DRILLS ============ */
.drill-top{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:1rem 0 .4rem}
.progress-chip{font-family:var(--mono);font-size:.75rem;color:var(--muted);background:var(--panel);
  border:1px solid var(--border);border-radius:999px;padding:.25rem .8rem}
.pbar{flex:1;min-width:120px;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue);transition:width .2s ease}
.qcard{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);padding:1.1rem;margin:.9rem 0}
.qtext{color:var(--bright);font-weight:600;margin:.4rem 0 .8rem;font-size:1rem}
.opt{display:flex;align-items:flex-start;gap:.6rem;width:100%;text-align:left;min-height:48px;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
  padding:.7rem .9rem;margin:.45rem 0;font-size:.92rem;transition:border-color .15s ease}
.opt:hover:enabled{border-color:var(--blue)}
.opt .ol{font-family:var(--mono);color:var(--muted);flex-shrink:0}
.opt.correct{border-color:var(--green);background:rgba(137,209,133,.09)}
.opt.wrong{border-color:var(--red);background:rgba(244,135,113,.09)}
.opt:disabled{cursor:default;opacity:.85}
.feedback{border-radius:var(--radius);padding:.75rem 1rem;margin:.8rem 0;font-size:.9rem;display:none}
.feedback.ok{display:block;background:rgba(137,209,133,.09);border:1px solid var(--green-dim)}
.feedback.bad{display:block;background:rgba(244,135,113,.09);border:1px solid var(--red)}
.feedback b{font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;gap:.45rem;min-height:44px;padding:.55rem 1.2rem;
  border-radius:var(--radius);border:1px solid var(--border);background:var(--card2);
  color:var(--bright);font-size:.9rem;font-weight:600;transition:background .15s ease}
.btn:hover{background:#3d3d40}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#1a1a1a}
.btn.primary:hover{background:#6aa5dd}
.btn.ghost{background:transparent}
.score-card{text-align:center;padding:2rem 1rem}
.score-card .big{font-family:var(--mono);font-size:2.4rem;color:var(--bright);font-weight:700}
/* ============ FLASHCARDS ============ */
.fc-wrap{perspective:1200px;margin:1rem 0}
.fc{position:relative;width:100%;min-height:210px;cursor:pointer;transform-style:preserve-3d;
  transition:transform .45s ease}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1.2rem;text-align:center}
.fc-back{transform:rotateY(180deg);justify-content:flex-start}
.fc-front .term{font-family:var(--mono);font-size:1.25rem;color:var(--bright);font-weight:700}
.fc-front .hint{position:absolute;bottom:.7rem;font-size:.7rem;color:var(--muted)}
.fc-back .src{position:absolute;bottom:.7rem;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.fc-back .def{margin-top:2.2rem;font-size:.95rem;color:var(--text)}
.fc-nav{display:flex;gap:.6rem;justify-content:center;margin-top:1rem;flex-wrap:wrap}
/* ============ COMPLETE THE CODE ============ */
.blank{font-family:var(--mono);background:var(--panel);border:1px dashed var(--muted);border-radius:4px;
  padding:.3rem .5rem;margin:0 .15rem;color:var(--bright);min-width:3.2rem;min-height:26px;display:inline-block;
  text-align:center;line-height:1.2;vertical-align:middle;cursor:pointer}
.blank.selected{border-color:var(--blue);border-style:solid;box-shadow:0 0 0 1px var(--blue)}
.blank.ok{border-color:var(--green);border-style:solid;color:var(--green)}
.blank.bad{border-color:var(--red);border-style:solid;color:var(--red)}
.bank{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0}
.chip{font-family:var(--mono);font-size:.8rem;background:var(--card2);border:1px solid var(--border);
  border-radius:999px;padding:.4rem .9rem;min-height:44px;display:inline-flex;align-items:center;color:var(--bright);
  cursor:pointer}
.chip:hover{border-color:var(--blue)}
.comp-actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}
/* ============ REVEAL / CONSOLE ============ */
details.reveal{border:1px solid var(--border-soft);border-radius:var(--radius);margin:.8rem 0;background:var(--card)}
details.reveal summary{cursor:pointer;padding:.7rem 1rem;font-family:var(--mono);font-size:.8rem;color:var(--blue);min-height:44px;display:flex;align-items:center}
details.reveal summary:hover{color:var(--bright)}
.console{background:#141414;border-top:1px solid var(--border-soft);padding:.8rem 1rem;
  font-family:var(--mono);font-size:.78rem;line-height:1.6;color:var(--green);white-space:pre-wrap;margin:0}
/* ============ STATUS BAR ============ */
.statusbar{height:var(--status-h);background:#007ACC;background:#265a86;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 .9rem;
  font-family:var(--mono);font-size:.7rem;color:#e8f2fa;flex-shrink:0;gap:1rem}
.statusbar .right{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
@media (max-width:520px){.statusbar .right{display:none}}
/* ============ A11Y & TOUCH ============ */
html{-webkit-tap-highlight-color:transparent}
body{touch-action:manipulation}
a,button,summary{touch-action:manipulation}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
.progress-chip,.fc-count,.badge,.big{font-variant-numeric:tabular-nums}
.sidebar{overscroll-behavior:contain}
.statusbar{padding-bottom:env(safe-area-inset-bottom)}
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--blue);color:#fff;
  padding:.6rem 1rem;border-radius:0 0 var(--radius) 0;font-family:var(--mono);font-size:.8rem}
.skip:focus{left:0}
@media print{.topbar,.sidebar,.scrim,.statusbar{display:none}body{height:auto;overflow:visible}.main{overflow:visible}}
</style>
</head>

  <button class="menu-btn" id="menuBtn" aria-label="Open navigation menu" aria-expanded="false">

<script>
"use strict";
/* ================= DATA ================= */
const MODULES=[
{id:"m1",file:"Dog.vb",title:"Classes & Objects",tag:"Module 1 · Ch 1",
analogy:{title:"The cookie cutter",text:"A Class is like a cookie cutter — it defines the shape. An Object is an actual cookie made from that cutter. One cutter, many cookies: one class, many objects."},
intro:["A class bundles data and behavior into one blueprint. Every object you create from it gets its own copy of the data defined by the class.",
"In VB.NET, a class has four parts, and each part has one job. Learn the four parts and you can read almost any class."],
parts:[
 {name:"1. Fields",role:"Private memory",text:"Variables that hold the object's data — like a car's color or a person's name. Kept Private so outside code cannot reach in directly."},
 {name:"2. Constructor (Sub New)",role:"Birth setup",text:"Runs once, the moment the object is created. Its job is to set starting values."},
 {name:"3. Properties",role:"Safe doors",text:"Public Get/Set accessors — the safe 'doors' to the private fields. They can validate before allowing a change."},
 {name:"4. Behaviors (Methods)",role:"Actions",text:"Sub = an action with no return value (a dog barks). Function = a calculation that returns a result."}],
examples:[
 {file:"Dog.vb",code:`Public Class Dog
    Private _name As String
    Private _age As Integer

    Public Sub New(startingName As String)
        _name = startingName
        _age = 1   ' every new dog starts at age 1
    End Sub

    Public ReadOnly Property Name() As String
        Get
            Return _name
        End Get
    End Property

    Public Property Age() As Integer
        Get
            Return _age
        End Get
        Set(value As Integer)
            If value > 0 Then
                _age = value
            End If
        End Set
    End Property

    Public Sub Bark()
        MessageBox.Show(_name & " says: Arf! Arf!")
    End Sub

    Public Function GetHumanYears() As Integer
        Return _age * 7
    End Function
End Class`,happened:[
 "_name and _age are Fields — hidden inside the object.",
 "Sub New is the Constructor: a new Dog gets its name and automatically starts at age 1.",
 "Name is ReadOnly — it has a Get but no Set, so nobody outside can rename the dog.",
 "Age has a Get and a Set; the Set only accepts values greater than 0.",
 "Bark is a Sub (action, no return). GetHumanYears is a Function (returns _age * 7)."]},
 {file:"Form1.vb",code:`Dim myPet As New Dog("Bantay")
myPet.Age = 3
myPet.Bark()

Dim calculatedAge As Integer = myPet.GetHumanYears()
MessageBox.Show("Bantay is " & calculatedAge & " in human years")`,happened:[
 "New Dog(\"Bantay\") creates the object — the constructor runs once and _age = 1.",
 "myPet.Age = 3 goes through the property's Set; 3 > 0 so it is accepted.",
 "Bark() shows the MessageBox: Bantay says: Arf! Arf!",
 "GetHumanYears() returns 3 * 7 = 21 — Bantay is 21 in human years."]}],
tables:[],
summary:["Class = blueprint; Object = an instance created from it.","Fields = hidden data.","Constructor (Sub New) = birth setup, runs once.","Properties = Get/Set doors that can validate.","Methods = Subs (actions) and Functions (calculations that return a value)."]},

{id:"m2",file:"PiggyBank.vb",title:"Encapsulation",tag:"Module 2 · Ch 3",
analogy:{title:"The pill capsule & TV remote",text:"A capsule wraps medicine inside one shell — encapsulation wraps data and methods inside one class. A TV remote exposes only public buttons while the wiring stays hidden — Private fields are the wiring nobody should touch."},
intro:["Encapsulation = wrapping variables and the methods that operate on them together inside one class.",
"Information hiding = making the data Private so it can only be changed through safe, validating doors."],
goldenRule:["Rule 1 — always make your variables Private.","Rule 2 — always make your Methods and Properties Public."],
parts:[],
examples:[
 {file:"PiggyBank.vb",code:`Public Class PiggyBank
    Private _moneyInside As Double = 0

    Public Sub InsertMoney(amount As Double)
        _moneyInside = _moneyInside + amount
    End Sub

    Public Function CheckBalance() As Double
        Return _moneyInside
    End Function
End Class`,happened:[
 "_moneyInside is Private — no form code can set it directly.",
 "The only ways in are InsertMoney and CheckBalance.",
 "If form code tried myBank._moneyInside = 999 it would cause an error — the field is hidden."]},
 {file:"Form1.vb",code:`Private Sub btnDeposit_Click(sender As Object, e As EventArgs) Handles btnDeposit.Click
    myBank.InsertMoney(50.0)
    lblBalance.Text = "Balance: P" & myBank.CheckBalance()
End Sub`,happened:[
 "The button deposits 50.00 through the public method.",
 "The label then shows: Balance: P50.",
 "Notice the button holds no logic about the balance — the class guards its own data."]},
 {file:"Student.vb",code:`Public Class Student
    Private _grade As Integer

    Public Property StudentGrade() As Integer
        Get
            Return _grade
        End Get
        Set(value As Integer)
            If value < 0 Then
                MessageBox.Show("Error: A grade cannot be negative!")
            Else
                _grade = value
            End If
        End Set
    End Property
End Class`,happened:[
 "The Set block is a guard: a negative value is rejected with a MessageBox.",

{id:"m3",file:"Person.vb",title:"Inheritance",tag:"Module 3 · Ch 2",
analogy:{title:"The family tree",text:"A child inherits traits from a parent, then develops skills of their own. In code, a derived class inherits the members of a base class and adds its own."},
intro:["Inheritance = a new class built on an existing class. The child automatically reuses everything the parent does not keep private.",
"You already know these IS-A relationships: Student IS A Person. SavingsAccount IS A BankAccount. Manager IS AN Employee."],
parts:[],
termsTable:{title:"Inheritance terminology",head:["Term","What it means"],rows:[
 ["Base Class (parent)","The class that shares its members with its children."],
 ["Derived Class (child)","The class that inherits from the base and adds its own members."],
 ["Inherits","The keyword placed under the child class name."],
 ["Protected","Hidden from the Windows Form, but child classes can use it directly."],
 ["MyBase.New(...)","How a child constructor passes starting values up to the parent constructor."],
 ["Overridable / Overrides","Parent grants permission; child replaces the method with its own version."]]},
examples:[
 {file:"Person.vb",code:`Public Class Person
    Protected _name As String
    Protected _age As Integer

    Public Property Name() As String
        Get
            Return _name
        End Get
        Set(value As String)
            _name = value
        End Set
    End Property

    Public Property Age() As Integer
        Get
            Return _age
        End Get
        Set(value As Integer)
            If value > 0 Then
                _age = value
            Else
                MessageBox.Show("Error: Age must be positive!")
            End If
        End Set
    End Property

    Public Function GetBasicInfo() As String
        Return "Name: " & _name & " | Age: " & _age
    End Function
End Class`,happened:[
 "_name and _age are Protected, not Private — hidden from the form, but visible to child classes.",
 "Age's Set guards against non-positive values.",
 "GetBasicInfo returns Name: ... | Age: ... from the parent's own fields."]},
 {file:"Student.vb",code:`Public Class Student
    Inherits Person

    Private _course As String

    Public Property Course() As String
        Get
            Return _course
        End Get
        Set(value As String)
            _course = value
        End Set
    End Property

    Public Sub Study()
        MessageBox.Show(_name & " is studying for " & _course & ".")
    End Sub
End Class`,happened:[
 "Inherits Person gives Student the parent's Name, Age and GetBasicInfo for free.",
 "Student only declares what is new: _course, the Course property, and Study().",
 "Study() uses Protected _name directly — only a child class can do that; the form cannot."]},
 {file:"Employee.vb + Manager.vb",code:`Public Class Employee
    Protected _empName As String
    Protected _baseSalary As Double

    Public Sub New(name As String, salary As Double)
        _empName = name
        If salary < 0 Then
            _baseSalary = 0
        Else
            _baseSalary = salary
        End If
    End Sub

    Public ReadOnly Property EmployeeName() As String
        Get
            Return _empName
        End Get
    End Property

    Public Overridable Function ComputePay() As Double
        Return _baseSalary
    End Function
End Class

Public Class Manager
    Inherits Employee

    Private _Allowance As Double

    Public Sub New(name As String, salary As Double, allowance As Double)
        MyBase.New(name, salary)
        _Allowance = allowance
    End Sub

    Public Overrides Function ComputePay() As Double
        Return _baseSalary + _Allowance
    End Function
End Class`,happened:[
 "Employee's constructor rejects a negative salary by storing 0.",
 "Manager's constructor calls MyBase.New(name, salary) so the parent sets up the shared fields first.",
 "Manager overrides ComputePay to return _baseSalary + _Allowance."]},
 {file:"Form1.vb",code:`Dim emp As New Employee("Maria Santos", 15000.0)
Dim mgr As New Manager("Carlo Reyes", 20000.0, 5000.0)

lblRegular.Text = emp.EmployeeName & " Pay: P" & emp.ComputePay()
lblManager.Text = mgr.EmployeeName & " Pay: P" & mgr.ComputePay()`,happened:[
 "The employee's pay: ₱15,000 — the base version runs.",
 "The manager's pay: ₱25,000 — the overridden version runs (20,000 + 5,000)."]}],

{id:"m4",file:"Animal.vb",title:"Method Overriding",tag:"Module 4 · Ch 4",
analogy:{title:"The family adobo recipe",text:"A parent passes down an adobo recipe. The child keeps the dish's name — CookAdobo — but customizes the steps, like adding coconut milk. Same signature, new behavior."},
intro:["Method overriding = a child class replaces an inherited method with its own version, keeping the same name and signature.",
"Three keywords run the whole show:"],
kwTable:{title:"The three keywords",head:["Keyword","Where it goes","What it does"],rows:[
 ["Overridable","Parent method header","Gives permission to override."],
 ["Overrides","Child method header","Replaces the parent's version."],
 ["MyBase.MethodName()","Inside the child's method (optional)","Runs the parent's original first — add steps on top."]]},
parts:[],
examples:[
 {file:"Animal.vb",code:`Public Class Animal
    Public Overridable Sub MakeSound()
        MessageBox.Show("The animal makes a sound.")
    End Sub
End Class

Public Class Dog
    Inherits Animal
    Public Overrides Sub MakeSound()
        MessageBox.Show("Dog says: Arf! Arf!")
    End Sub
End Class

Public Class Cat
    Inherits Animal
    Public Overrides Sub MakeSound()
        MessageBox.Show("Cat says: Meow! Meow!")
    End Sub
End Class`,happened:[
 "Animal grants permission with Overridable.",
 "Dog and Cat each answer with Overrides — same name, same shape, new behavior.",
 "Calling MakeSound() on each object runs that object's own version: the animal makes a sound, Dog says: Arf! Arf!, Cat says: Meow! Meow!"]},
 {file:"Customer.vb + SeniorCustomer.vb",code:`Public Class Customer
    Protected _customerName As String
    Protected _totalAmount As Double

    Public Sub New(name As String, amount As Double)
        _customerName = name
        _totalAmount = amount
    End Sub

    Public Overridable Function ComputeFinalBill() As Double
        Return _totalAmount
    End Function
End Class

Public Class SeniorCustomer
    Inherits Customer

    Public Sub New(name As String, amount As Double)
        MyBase.New(name, amount)
    End Sub

    Public Overrides Function ComputeFinalBill() As Double
        Dim discount As Double = _totalAmount * 0.2
        Return _totalAmount - discount
    End Function
End Class`,happened:[
 "The base version just returns the total amount.",
 "The senior version computes a 20% discount, then subtracts it."]},
 {file:"Form1.vb",code:`Dim reg As New Customer("Ana Lopez", 1000.0)
Dim senior As New SeniorCustomer("Lolo Pedro", 1000.0)

lblRegularBill.Text = "Regular Bill: P" & reg.ComputeFinalBill()
lblSeniorBill.Text = "Senior Bill: P" & senior.ComputeFinalBill()`,happened:[
 "Ana Lopez's bill: ₱1,000 — no discount.",
 "Lolo Pedro's bill: ₱800 — the override applies 1,000 - 200."]}],
rules:{title:"The three rules of overriding",items:[
 "Match the signature — same method name, same parameter list, same return type.",
 "Permission required — you cannot use Overrides unless the parent marked the method Overridable.",
 "Private methods cannot be overridden — an Overridable method must be Public or Protected."]},
summary:["Overridable = permission (parent).","Overrides = replacement (child).","MyBase.MethodName() = run the original first, then add steps.","Overriding is VB.NET's runtime polymorphism in action."]}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function setStatus(t){$("#statusRight").textContent=t}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* ---- VB syntax highlighter ---- */
const RX=/('[^\n]*)|("(?:[^"\n])*")|\b(\d+(?:\.\d+)?)\b|\b(Public|Private|Protected|Class|Sub|Function|End|Inherits|Overrides|Overridable|NotOverridable|MyBase|Me|Dim|As|New|If|Then|Else|Return|While|Do|Loop|Until|For|Next|To|Mod|And|Or|Not|True|False|ReadOnly|WriteOnly|Property|Get|Set|Shared|ByVal)\b|\b(Integer|Double|String|Boolean|Decimal|Object|MessageBox|Dog|Cat|Animal|Person|Student|Employee|Manager|Customer|SeniorCustomer|PiggyBank|Bank|Account)\b/g;
function hl(c){return esc(c).replace(RX,(m,cm,st,n,k,t)=>
  cm?'<span class="c-com">'+cm+"</span>":
  st?'<span class="c-str">'+st+"</span>":
  n?'<span class="c-num">'+n+"</span>":
  k?'<span class="c-key">'+k+"</span>":
    '<span class="c-typ">'+t+"</span>")}
function codeBlock(file,code,plain){
  if(plain)return '<div class="code"><div class="code-tab"><span class="dot"></span>'+esc(file)+'<span class="lang">VB</span></div><pre class="code-body plain">'+code+"</pre></div>";
  const body=hl(code).split("\n").map(l=>'<span class="cl">'+(l||" ")+"</span>").join("");
  return '<div class="code"><div class="code-tab"><span class="dot"></span>'+esc(file)+'<span class="lang">VB</span></div><pre class="code-body">'+body+"</pre></div>"}
function callout(kind,title,inner){return '<div class="callout '+kind+'"><span class="co-title">'+esc(title)+"</span>"+inner+"</div>"}
function tbl(title,head,rows){
  const body=rows.map(r=>"<tr>"+r.map(c=>{
    if(c&&typeof c==="object")return '<td class="'+(c.y?"yes":"no")+'">'+(c.y?"✓":"✗")+"</td>";
    return "<td>"+esc(c)+"</td>"}).join("")+"</tr>").join("");
  return (title?"<h3>"+esc(title)+"</h3>":"")+'<div class="twrap"><table><thead><tr>'+head.map(h=>"<th>"+esc(h)+"</th>").join("")+'</tr></thead><tbody>'+body+"</tbody></table></div>"}

 $("#shufB").addEventListener("click",()=>{shuffle(F.order);F.i=0;F.flipped=false;renderCard()})}
/* ---- Complete the Code ---- */
function completeView(filter){
 const items=DRILLS.complete.filter(x=>!filter||x.m===filter);
 setStatus("Complete the Code");document.title="Complete the Code — OOP Finals Reviewer";
 viewEl.innerHTML='<p class="kicker">Written exam format · '+items.length+' items</p><h1>Complete the Code</h1>'+
 '<p class="lead">Tap a blank, then tap a word from the bank. Real code from the modules — nothing invented.</p>'+
 items.map((it,ix)=>compCard(it,ix)).join("");
 items.forEach((it,ix)=>wireComp(it,ix))}
function compCard(it,ix){
 const mod=MOD(it.m);
 const parts=it.code.split(/\{\{(\d+)\}\}/);
 let body="";
 for(let s=0;s<parts.length;s++){
  if(s%2===0){body+=parts[s]?hl(parts[s]):""}
  else{body+='<button class="blank" data-item="'+ix+'" data-b="'+parts[s]+'">_____</button>'}}
 return '<div class="qcard"><p class="kicker">'+mod.title+' · <span style="color:var(--bright)">'+esc(it.title)+"</span></p>"+
 '<div class="code"><div class="code-tab"><span class="dot"></span>'+esc(it.title.replace(/\s+/g,"_"))+'.vb<span class="lang">VB</span></div><pre class="code-body plain">'+body+"</pre>"+
 '<div class="bank" data-bank="'+ix+'"></div>'+
 '<div class="comp-actions"><button class="btn primary" data-check="'+ix+'">Check answers</button><button class="btn ghost" data-reset="'+ix+'">Reset</button></div>'+
 '<div class="feedback" id="fb-'+ix+'" aria-live="polite"></div></div></div>'}
function wireComp(it,ix){
 const card=viewEl.querySelectorAll(".qcard")[ix];
 const bank=card.querySelector(".bank");
 const words=shuffle([...new Set(it.blanks.flatMap(b=>b.opts))]);
 bank.innerHTML=words.map(w=>'<button class="chip">'+esc(w)+"</button>").join("");
 const state=it.blanks.map(()=>null);
 const blanks=card.querySelectorAll(".blank");
 let sel=-1;
 blanks.forEach(b=>b.addEventListener("click",()=>{sel=+b.dataset.b;
  blanks.forEach(x=>x.classList.remove("selected"));b.classList.add("selected")}));
 bank.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
  if(sel<0)sel=state.findIndex(v=>v===null);if(sel<0)return;
  state[sel]=ch.textContent;blanks[sel].textContent=ch.textContent;blanks[sel].classList.remove("bad","ok");
  sel=(state.findIndex(v=>v===null));blanks.forEach(x=>x.classList.remove("selected"));
  if(sel>=0)blanks[sel].classList.add("selected")}));
 card.querySelector("[data-check]").addEventListener("click",()=>{
  let good=0;state.forEach((v,b)=>{const ok=v===it.blanks[b].ans;blanks[b].classList.add(ok?"ok":"bad");blanks[b].classList.remove(ok?"bad":"ok");if(ok)good++});
  const fb=card.querySelector(".feedback");fb.className="feedback "+(good===it.blanks.length?"ok":"bad");
  fb.innerHTML="<b>"+good+" / "+it.blanks.length+" correct.</b> "+esc(it.why)});
 card.querySelector("[data-reset]").addEventListener("click",()=>{
  state.forEach((_,b)=>{state[b]=null;blanks[b].textContent="_____";blanks[b].className="blank"});sel=-1;
  card.querySelector(".feedback").className="feedback"})}
/* ---- ROUTER ---- */
function route(){
 const h=location.hash||"#/";const p=h.slice(2).split("/");
 closeDrawer();
 if(p[0]==="lesson"&&MOD(p[1]))lessonView(p[1]);
 else if(p[0]==="practice")practiceView(p[1]||"hub",p[2]);
 else if(p[0]==="activities")activitiesView();
 else if(p[0]==="quizzes")quizzesView();
 else homeView();
 navEl.querySelectorAll("a").forEach(a=>a.classList.toggle("active",a.getAttribute("href")===h));
 mainEl.scrollTop=0;viewEl.focus({preventScroll:true})}
window.addEventListener("hashchange",route);
$(".skip").addEventListener("click",e=>{e.preventDefault();viewEl.focus()});
route();
/* PWA wiring: only when served over HTTP(S) — opening the file directly via file:// stays fully functional as-is */
if(/^https?:$/.test(location.protocol)){
 document.head.insertAdjacentHTML("beforeend",'<link rel="manifest" href="manifest.json">');
 addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
